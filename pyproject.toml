[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-markdown-cli"
version = "1.4.0"
description = "Convert PDFs, Office documents, ebooks, and images to Markdown, HTML, or JSON with the Datalab API, Mistral OCR, or GPT-Luna."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Nikita Sokolsky", email = "sokolx@gmail.com" },
]
maintainers = [
    { name = "Nikita Sokolsky", email = "sokolx@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
keywords = ["pdf", "markdown", "converter", "cli", "document", "ocr", "datalab", "marker", "mistral", "openai", "openrouter"]
dependencies = [
    "pikepdf>=10.15",
    "requests>=2.34",
    "tqdm>=4.70",
]

[project.urls]
"Homepage" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli"
"Repository" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli"
"Documentation" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli#readme"
"Issues" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli/issues"
"Changelog" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli/blob/main/CHANGELOG.md"

[project.scripts]
pdf-to-md = "docs_to_md.cli:entrypoint"

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
]
dev = [
    "pdf-to-markdown-cli[test]",
    "build>=1.6",
    "twine>=7.0",
    "ruff>=0.16",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: end-to-end tests that call real conversion APIs (run with: pytest -m live)"]

[tool.coverage.run]
source = ["docs_to_md"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise AssertionError"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]
