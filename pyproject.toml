[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-markdown-cli"
version = "0.5.2"
description = "CLI utility to convert PDFs and supported document formats to Markdown/JSON/HTML with Marker API."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Nikita Sokolsky", email = "sokolx@gmail.com" },
]
maintainers = [
    { name = "Nikita Sokolsky", email = "sokolx@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
keywords = ["pdf", "markdown", "converter", "cli", "document", "marker", "md"]
dependencies = [
    "backoff>=2.0",
    "diskcache>=5.0",
    "filetype>=1.0",
    "pikepdf>=8.0",
    "pydantic>=2.0",
    "ratelimit>=2.0",
    "requests>=2.0",
    "tqdm>=4.0",
]

[project.urls]
"Homepage" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli"
"Repository" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli"
"Documentation" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli#readme"
"Issues" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli/issues"
"Changelog" = "https://github.com/SokolskyNikita/pdf-to-markdown-cli/releases"

[project.scripts]
pdf-to-md = "docs_to_md.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "build>=1.2.0",
    "twine>=5.1.0",
    "ruff>=0.11.0",
    "types-requests>=2.32.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
