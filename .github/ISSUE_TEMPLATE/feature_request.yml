name: Feature request
description: Suggest an improvement or a new option
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The option, behavior, or output you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
