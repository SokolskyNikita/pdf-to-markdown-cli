name: Live API tests

# Converts the sample documents with the real Datalab API (a few cents per run).
# Requires a DATALAB_API_KEY repository secret. Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run live tests
        env:
          DATALAB_API_KEY: ${{ secrets.DATALAB_API_KEY }}
        run: |
          if [ -z "$DATALAB_API_KEY" ]; then
            echo "::error::Add a DATALAB_API_KEY repository secret to run live tests."
            exit 1
          fi
          pytest -m live -v
